# ==============================================================================
# Just Sortd — Ops Brain Configuration
# STRICT PRINCIPLE: Prompts, model routing, scoring weights, and thresholds
# MUST live here in versioned configuration. NEVER hardcoded in Python.
# ==============================================================================

version: "1.0.0"

models:
  primary: "gemini-2.5-flash"
  fallback: "gpt-4o-mini"
  temperature: 0.1
  max_output_tokens: 2048

# Pricing per million tokens (USD) - updated for 2026 pricing
pricing:
  gemini-2.5-flash:
    input_per_million: 0.075
    output_per_million: 0.30
  gpt-4o-mini:
    input_per_million: 0.15
    output_per_million: 0.60
  usd_to_inr_rate: 86.0

# Deterministic Priority Ranker Weights (sum to 1.0)
priority_weights:
  goal_weight: 0.40              # Strategic importance of the associated goal
  deadline_urgency: 0.35         # How soon is the deadline relative to now
  downstream_blocker_count: 0.25 # Number of other tasks blocked by this task

# Slip Detection & Cascade Thresholds
slip_rules:
  threshold_days: 3             # Flag when upstream slips >= 3 days before downstream due date
  buffer_safety_days: 1         # Grace period between tasks before triggering cascade
  goal_risk_levels:
    on_track: "On Track"        # All tasks finish before goal deadline
    at_risk: "At Risk"          # Final task finishes on the exact goal deadline
    off_track: "Off Track"      # Final task slips past the goal deadline

# Human & Working Hours Constraints (IST)
working_hours:
  timezone: "Asia/Kolkata"
  active_days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]
  start_time: "10:00"
  end_time: "19:00"
  emergency_override: false     # If true, sends alert even outside working hours for Off Track

# Extraction Prompts
prompts:
  system_instruction: |
    You are an elite Operations Intelligence Agent for "Just Sortd", a fast-moving Indian D2C brand.
    Your mission is to parse messy, multilingual team standup notes (mixing Hindi, Gujarati, and English)
    and output clean, structured, high-ownership English tasks linked to strategic business goals.

    CRITICAL RULES:
    1. NEVER make up tasks not grounded in the meeting note.
    2. Translate colloquial Hindi/Gujarati phrases into clear, professional English task titles.
    3. Identify the core overarching goal (e.g. Diwali Festive Drop Launch by Nov 30).
    4. For every task, extract:
       - title: Crisp, action-oriented English verb phrase (e.g., "Coordinate fabric sample swatches with Surat vendor")
       - owner: Name of the accountable individual (e.g., "Rahul", "Priya", "Karan")
       - due_date: ISO 8601 date string (YYYY-MM-DD). If year is omitted in notes, assume current year 2026.
       - goal_name: The exact name of the goal this task supports
       - depends_on_titles: List of exact task titles that MUST finish before this task can start
       - confidence: Score between 0.0 and 1.0 on extraction accuracy
       - reasoning: Brief explanation quoting the source meeting context and why dependencies were assigned
    5. Output must be strictly compliant with the required JSON schema.

  extraction_prompt: |
    Analyze the following team standup/brainstorm meeting note.
    The note contains a mix of English, Hindi (Hinglish), and Gujarati.
    
    Extract the primary goal, all structured action items with strict owners, deadlines, and explicit dependency links.
    
    --- MEETING NOTE START ---
    {meeting_text}
    --- MEETING NOTE END ---
    
    Return JSON matching the schema:
    {{
      "goal_name": "<string>",
      "goal_due_date": "<YYYY-MM-DD>",
      "meeting_summary": "<crisp 2-sentence summary in English>",
      "source_language_detected": "<e.g. English + Hindi + Gujarati>",
      "tasks": [
        {{
          "title": "<English action phrase>",
          "owner": "<Name>",
          "due_date": "<YYYY-MM-DD>",
          "goal_name": "<Goal Name>",
          "depends_on_titles": ["<Upstream Task Title>"],
          "confidence": 0.95,
          "reasoning": "<context quote & reasoning>"
        }}
      ]
    }}
